name: Homem
options:
  bundleIdPrefix: ad.neko
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  Homem:
    type: application
    platform: iOS
    sources: [Homem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.homem
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Homem/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftTerm
      - package: WebRTC
  HomemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HomemTests]
    dependencies:
      - target: Homem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HomemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HomemUITests]
    dependencies:
      - target: Homem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Homem:
    build:
      targets:
        Homem: all
    test:
      targets: [HomemTests, HomemUITests]
